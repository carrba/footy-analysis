[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy", "pandas", "pyarrow", "scipy", "matplotlib", "scikit-learn",
  "opencv-python", "pyyaml", "ultralytics", "supervision",
]  # torch/torchvision: install separately (CPU wheels from https://download.pytorch.org/whl/cpu)

[tool.setuptools.packages.find]
where = ["src"]
